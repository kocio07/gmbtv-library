<!DOCTYPE html>
<html>
    <head>
        <title> Library</title>
        <link rel="stylesheet" href="library.css">
    </head>
    <body>
        <h1>This is your private collection.</h1>
    <div id="controlcenterxd">
        <div  class="tabs" id="tabs">
            <button class="tab a" data-type="all">All</button>
            <button class="tab" data-type="books">Books</button>
            <button class="tab" data-type="movies">Movies</button>
            <button class="tab" data-type="serials">Serials</button>
            <button class="tab" data-type="games">Games</button>
      </div>
      <input class="searchbar" type="text" id="searchbar" placeholder="Search for a title">
      <button class="addbutton" id="add"> + add something</button>
    </div>
    <div id="adder">
    <input type="text" id="ftitle" placeholder="Title">
        <select id="ftype">

            <option value="books">book</option>
            <option value="movies">movie</option>
            <option value="serials">series</option>
            <option value="games">game</option>
        </select>
        <textarea id="fopinion" placeholder="Review"></textarea>
        <button id="savebutton">Save</button>

    </div>

    <div id="grid">



    <script src="script.js"></script>
    </body>
</html>
