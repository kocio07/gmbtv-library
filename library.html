<!DOCTYPE html>
<html>
    <head>
        <title> Library</title>
        <link rel="stylesheet" href="library.css">
    </head>
    <body>
        <h1>This is your private collection.</h1>
    <div  class="controlcenter" id="controlcenterxd">
        <div  class="tabs" id="tabs">
            <button class="tab a" data-type="all">All</button>
            <button class="tab" data-type="Book">Books</button>
            <button class="tab" data-type="Movie">Movies</button>
            <button class="tab" data-type="Serial">Serials</button>
            <button class="tab" data-type="Game">Games</button>
        </div>
    <div class="controlcenter1">
        <input class="searchbar" type="text" id="searchbar" placeholder="Search for a title">
        <button class="addbutton" id="add"> + Add new stuff</button>
    </div>
      </div>

   
    </div>

    <div class="overlay" id="overlay">
        <div class="adder" id="adder">
            <button class="closem" id="closem" >X</button>
        <input type="text" id="ftitle" placeholder="Title">
            <select id="ftype">
                <option value="Book">Book</option>
                <option value="Movie">Movie</option>
                <option value="Serial">Series</option>
                <option value="Game">Game</option>
            </select>
            <textarea id="fopinion" placeholder="Review"></textarea>
            <button id="savebutton">Save</button>
        </div>
   

    <div id="grid"></div>



    <script src="script.js"></script>
    </body>
</html>
